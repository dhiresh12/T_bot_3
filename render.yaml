services:
  - type: web
    name: xio-payplus
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "app.mini_app:create_app()" --bind 0.0.0.0:$PORT # This is the correct command
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME # Add your bot's username here
        value: xiolis_bot
      - key: ADMIN_KEY
        sync: false
      - key: MONGO_URI # Example: mongodb+srv://user:pass@cluster.mongodb.net/yourDbName
        sync: false
